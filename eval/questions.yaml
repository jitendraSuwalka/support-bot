# The labelled question set for the evaluation harness.
#
# Each case says what a correct turn looks like:
#   expected      answer   — answered from the documents, not escalated
#                 escalate — handed to a human (by the model or by the policy);
#                            where gold is given, a correct turn also signposts
#                            the right team or page from it
#                 clarify  — one clarifying question, not escalated
#                 decline  — outside what a support assistant for the firm can
#                            help with: say so, point to the switchboard, do not
#                            book an adviser (decline_out_of_scope)
#                 greeting — a pleasantry, answered with no tool
#   kind          why the case is in the set (see eval/dataset.py for the list)
#   gold          the corpus sections that answer or signpost it, as
#                 "doc-id/Section name"; any chunk of a gold section counts as a
#                 retrieval hit
#   must_contain  strings a correct answer copies: the essential figure, phone
#                 number, postcode or name, never incidental detail. Each must
#                 appear in a gold section, so the label can be checked against
#                 the corpus (tests/test_dataset.py). Matched case-insensitively.
#   tools         the tools a correct turn uses (order not required; extra tools
#                 do not fail it); escalation forced by the policy counts as
#                 escalate_to_adviser even without the tool call
#   before        optional earlier customer messages in the same conversation;
#                 the labels apply to the final turn
#
# Questions are written the way customers write: short, long, polite, blunt,
# with typos, with context the documents do not need. Every document has at
# least three questions; every expected behaviour has several. The set was
# reviewed by an independent compliance-style reviewer on 22 October 2026 and
# corrected: seven labels, eight over-strict must_contain strings, seven gold
# sections, nine rewordings, and 40 questions added. Reviewed again on
# 23 October 2026 against the baseline run (reports/live-baseline.json): four
# labels corrected where the agent's behaviour was the better one on reflection
# (security-06, life-07 and action-01 to escalate; ambiguous-03 to answer), each
# with its reason beside it, and the tools of the clarify and decline cases set
# to the tools those behaviours now are. Every other failure stood.

# --- factual: answerable from the documents ------------------------------------

