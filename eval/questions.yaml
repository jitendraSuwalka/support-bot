# The labelled question set for the evaluation harness.
#
# Each case says what a correct turn looks like:
#   expected      answer | escalate | clarify | greeting
#   kind          why the case is in the set (see eval/dataset.py for the list)
#   gold          the corpus sections that answer it, as "doc-id/Section name";
#                 any chunk of a gold section counts as a retrieval hit
#   must_contain  strings a correct answer copies exactly: figures, phone numbers,
#                 postcodes, addresses. Each must appear in a gold section, so the
#                 label can be checked against the corpus (tests/test_dataset.py)
#   tools         the tools a correct turn uses (order not required)
#
# Questions are written the way customers write: short, long, polite, blunt,
# with typos, with context the documents do not need. Every document has at
# least two questions; every expected behaviour has several.

# --- factual: answerable from the documents ------------------------------------

