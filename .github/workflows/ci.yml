# Continuous integration: every push and pull request installs the project from
# scratch on a clean machine, lints it, checks formatting and runs the tests.
# A green tick means "a stranger's computer can run this today".

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # The project is developed on Windows; prove it runs there too.
          - os: windows-latest
            python-version: "3.12"

    env:
      # Agent output contains non-ASCII characters; keep Windows consoles UTF-8.
      PYTHONUTF8: "1"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install the locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run the test suite with coverage
        run: pytest --cov --cov-report=term --cov-report=xml

      - name: Upload the coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  # The container the service ships in: build the image from the Dockerfile,
  # start it, and prove the service inside answers (health, readiness, the
  # docs, refusals, request ids), runs as an unprivileged user, carries no
  # tests or secrets, and is reported healthy by Docker. No model is called and
  # no secret is needed. Nobody has to install Docker locally for this.
  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build --tag support-bot:ci .

      - name: Smoke-test the running container
        run: bash scripts/container_smoke_test.sh support-bot:ci
